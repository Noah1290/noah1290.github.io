<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Noah HQ</title>
  <style>
    /* Zelfde kleuren als de rest van je site */
    :root {
      --donker: #14213d; --accent: #2f9e7a; --accent-licht: #e6f5ef;
      --tekst: #2b2d33; --grijs: #6b7280; --achtergrond: #f6f6f2; --wit: #fff; --rand: #e5e7eb;
      --rood: #c2410c; --rood-licht: #fff1e8; --oranje: #b45309; --oranje-licht: #fef6e4; --blauw: #1d4ed8; --blauw-licht: #eef2ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--tekst);
           background: var(--achtergrond); line-height: 1.5; font-size: 15px; }
    a { color: var(--accent); }
    button, .knop { background: var(--accent); color: var(--wit); border: 0; border-radius: 8px; padding: 8px 14px;
             font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
    button.licht, .knop.licht { background: var(--wit); color: var(--donker); border: 1px solid var(--rand); }
    button.klein { padding: 4px 10px; font-size: 0.8rem; }
    button:disabled { opacity: 0.5; cursor: wait; }
    input, select, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--rand); border-radius: 8px; background: var(--wit); width: 100%; }
    textarea { min-height: 80px; resize: vertical; }
    label { font-size: 0.8rem; color: var(--grijs); display: grid; gap: 4px; }

    /* Indeling: zijbalk + inhoud */
    .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    nav { background: var(--donker); color: #c7cdd8; padding: 20px 12px; position: sticky; top: 0; height: 100vh; }
    nav .logo { color: var(--wit); font-weight: 800; font-size: 1.15rem; padding: 0 10px 18px; }
    nav .logo span { color: #8ee0c0; }
    nav button { display: block; width: 100%; text-align: left; background: transparent; color: #c7cdd8; padding: 10px; margin-bottom: 2px; font-weight: 500; }
    nav button.actief { background: rgba(255,255,255,0.1); color: var(--wit); }
    nav .teller { float: right; background: var(--accent); color: var(--wit); border-radius: 999px; padding: 0 8px; font-size: 0.75rem; }
    nav .onder { position: absolute; bottom: 16px; left: 12px; right: 12px; font-size: 0.8rem; }
    main { padding: 28px; max-width: 1200px; width: 100%; }
    h1 { color: var(--donker); font-size: 1.6rem; margin-bottom: 4px; }
    h2 { color: var(--donker); font-size: 1.15rem; margin: 22px 0 10px; }
    .sub { color: var(--grijs); margin-bottom: 18px; }
    .kaart { background: var(--wit); border: 1px solid var(--rand); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
    .raster { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .tegel .getal { font-size: 1.8rem; font-weight: 800; color: var(--donker); }
    .tegel .lbl { color: var(--grijs); font-size: 0.85rem; }
    .klein { font-size: 0.82rem; color: var(--grijs); }
    .rij { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .melding { padding: 12px 14px; border-radius: 10px; margin-bottom: 10px; }
    .melding.rood { background: var(--rood-licht); color: var(--rood); }
    .melding.oranje { background: var(--oranje-licht); color: var(--oranje); }
    .melding.groen { background: var(--accent-licht); color: var(--accent); }
    .melding.blauw { background: var(--blauw-licht); color: var(--blauw); }
    .label { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 0.75rem; font-weight: 700; }
    .verborgen { display: none !important; }

    /* Secretaresse */
    .secretaresse { border-left: 4px solid var(--accent); }
    .secretaresse .groet { font-size: 1.05rem; color: var(--donker); font-weight: 600; margin-bottom: 8px; }
    .secretaresse ul { margin: 6px 0 0 20px; }
    .secretaresse li { margin-bottom: 4px; }

    /* Takenlijst */
    .taak { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--rand); }
    .taak:last-child { border-bottom: 0; }
    .taak .tijd { min-width: 64px; font-weight: 700; color: var(--donker); }
    .taak .wat { flex: 1; }
    .taak .wat strong { color: var(--donker); }

    /* Agenda */
    .agenda { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .dag { background: var(--wit); border: 1px solid var(--rand); border-radius: 10px; padding: 10px; min-height: 180px; }
    .dag.vandaag { border: 2px solid var(--accent); }
    .dag h4 { font-size: 0.9rem; color: var(--donker); }
    .dag .vol { height: 6px; background: var(--rand); border-radius: 3px; margin: 6px 0 8px; overflow: hidden; }
    .dag .vol div { height: 100%; background: var(--accent); }
    .blok { border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; font-size: 0.8rem; cursor: pointer; }
    .blok.taakblok { background: var(--accent-licht); }
    .blok.afspraak { background: var(--blauw-licht); }
    .blok.krap { background: var(--oranje-licht); }
    .blok.telaat { background: var(--rood-licht); }
    .blok strong { display: block; color: var(--donker); }

    /* Tabel aanvragen */
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--rand); vertical-align: top; font-size: 0.9rem; }
    th { color: var(--grijs); font-weight: 600; font-size: 0.8rem; }
    td select { width: auto; padding: 4px 8px; }

    /* Paneel (rechts) */
    .paneel { position: fixed; top: 0; right: 0; width: min(620px, 100%); height: 100vh; background: var(--wit);
              box-shadow: -10px 0 30px rgba(0,0,0,0.15); padding: 24px; overflow-y: auto; z-index: 20; }
    .paneel .sluit { float: right; }
    .paneel pre { white-space: pre-wrap; background: var(--achtergrond); border: 1px solid var(--rand); border-radius: 8px; padding: 12px; font: inherit; font-size: 0.88rem; }
    .tabjes { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }

    /* Sites */
    .site { display: flex; gap: 12px; align-items: flex-start; }
    .site .stip { width: 10px; height: 10px; border-radius: 50%; background: var(--rand); margin-top: 7px; flex-shrink: 0; }
    .site .stip.aan { background: var(--accent); }
    .site .stip.uit { background: var(--rood); }
    code.cmd { display: block; background: var(--donker); color: #d7f5e9; padding: 10px 12px; border-radius: 8px; font-size: 0.82rem; white-space: pre-wrap; margin: 6px 0; }

    /* Inloggen */
    .inlog { max-width: 420px; margin: 12vh auto; }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      nav { position: static; height: auto; display: flex; flex-wrap: wrap; gap: 4px; }
      nav .logo { width: 100%; padding-bottom: 8px; }
      nav button { width: auto; }
      nav .onder { position: static; width: 100%; }
      .agenda { grid-template-columns: 1fr; }
      main { padding: 16px; }
    }
  </style>
</head>
<body>

<!-- Inloggen: alleen jij kent het ADMIN_TOKEN -->
<div id="inlogscherm" class="inlog verborgen">
  <div class="kaart">
    <h1>Noah <span style="color:var(--accent)">HQ</span></h1>
    <p class="sub">Vul je ADMIN_TOKEN in (het wachtwoord uit je Cloudflare-instellingen). Het wordt alleen in deze browser bewaard.</p>
    <form id="inlogform" class="rij">

      <button type="submit">Inloggen</button>
    </form>

</div>

<div id="app" class="app verborgen">
  <nav>
    <div class="logo">Noah <span>HQ</span></div>
    <button data-tab="vandaag" class="actief">☀️ Vandaag</button>
    <button data-tab="planning">🗓️ Planning</button>

      <button class="licht klein" id="uitloggen" style="color:var(--donker);margin-top:6px">Uitloggen</button>

  </nav>
  <main>
    <section id="tab-vandaag"></section>
    <section id="tab-planning" class="verborgen"></section>
    <section id="tab-aanvragen" class="verborgen"></section>
    <section id="tab-afspraken" class="verborgen"></section>

    <section id="tab-instellingen" class="verborgen"></section>
  </main>
</div>

<div id="paneel" class="paneel verborgen"></div>

<script>
// =====================================================================
// INSTELLINGEN DIE JE ZELDEN AANPAST
// =====================================================================
const WORKER_URL = "https://ai-spiegel.noah-fc5.workers.dev";
const SITE_URL = "https://noah1290.github.io";

// Standaardinstellingen. In het tabblad Instellingen kun je ze aanpassen; die worden in Cloudflare bewaard.
const STANDAARD = {
  uren: { 1: 3, 2: 3, 3: 3, 4: 3, 5: 3, 6: 0, 0: 0 },   // 0 = zondag, 1 = maandag … (naast je baan: 3 uur)
  buffer: 25,                // % van elke dag vrijhouden voor uitloop en vertraging
  termijn_rapport: 2,        // werkdagen na aanvraag: rapport + offerte versturen
  opvolgen_na: 3,            // werkdagen na offerte: opvolgen
  termijn_uitvoering: 5,     // werkdagen na akkoord: opleveren
  herscan_na: 30,            // kalenderdagen na oplevering: herscan
  korting: 15,               // pakketkorting in % bij 3 of meer verbeteringen
  // Minuten werk per verbeterpunt (voor je planning) en prijs per onderdeel (voor de offerte, excl. btw).
  minuten: {
    "AI-assistenten mogen de site lezen": 20, "Gestructureerde data aanwezig": 60, "Bedrijfsgegevens als 'bedrijf' gemarkeerd": 15,
    "Adres en telefoon in de gestructureerde data": 15, "Openingstijden in de gestructureerde data": 15,
    "Paginatitel zegt wat je doet en waar": 15, "Meta-omschrijving": 20, "Telefoonnummer te vinden op je website": 15,
    "Adres te vinden op je website": 15, "Genoeg leesbare tekst (300+ woorden)": 90, "Beveiligde verbinding (https)": 30,
    "llms.txt aanwezig": 20, "Werkt goed op mobiel": 45, "Reviews of beoordelingen zichtbaar": 45, "Sitemap aanwezig": 20,
    "Duidelijke uitleg van je diensten en werkgebied": 60,
  },
  prijzen: { schema: 125, robots: 35, titel: 35, meta: 35, contact: 35, tekst: 150, https: 50, llms: 50, mobiel: 75, reviews: 50, sitemap: 35 },
  vaste_minuten: { rapport: 30, opvolgen: 15, oplevering_extra: 30, herscan: 20 },
};
// Welk prijsonderdeel hoort bij welk verbeterpunt (sommige vallen samen onder één prijs).
const PRIJS_VAN = {
  "AI-assistenten mogen de site lezen": "robots", "Gestructureerde data aanwezig": "schema", "Bedrijfsgegevens als 'bedrijf' gemarkeerd": "schema",
  "Adres en telefoon in de gestructureerde data": "schema", "Openingstijden in de gestructureerde data": "schema",
  "Paginatitel zegt wat je doet en waar": "titel", "Meta-omschrijving": "meta", "Telefoonnummer te vinden op je website": "contact",
  "Adres te vinden op je website": "contact", "Genoeg leesbare tekst (300+ woorden)": "tekst", "Duidelijke uitleg van je diensten en werkgebied": "tekst",
  "Beveiligde verbinding (https)": "https", "llms.txt aanwezig": "llms", "Werkt goed op mobiel": "mobiel",
  "Reviews of beoordelingen zichtbaar": "reviews", "Sitemap aanwezig": "sitemap",
};
const PRIJS_NAAM = { schema: "Visitekaartje voor AI (gestructureerde data) met adres, telefoon en openingstijden",
  robots: "AI-assistenten toegang geven", titel: "Paginatitel die zegt wat je doet en waar", meta: "Korte samenvatting voor Google en AI",
  contact: "Telefoon en adres goed vindbaar", tekst: "Heldere tekst over je diensten en werkgebied", https: "Beveiligde verbinding (https)",
  llms: "llms.txt: uitleg voor AI-assistenten", mobiel: "Website geschikt voor telefoons", reviews: "Reviews zichtbaar op je website",
  sitemap: "Sitemap voor zoekmachines en AI" };

const STATUS = {
  nieuw: ["Nieuw", "var(--blauw)"], rapport_verstuurd: ["Rapport verstuurd", "var(--oranje)"],
  offerte_verstuurd: ["Offerte verstuurd", "var(--oranje)"], akkoord: ["Akkoord", "var(--accent)"],
  in_uitvoering: ["In uitvoering", "var(--accent)"], opgeleverd: ["Opgeleverd", "var(--donker)"],
  herscan_gedaan: ["Afgerond", "var(--grijs)"], afgewezen: ["Afgewezen", "var(--grijs)"],
};

// =====================================================================
// HULPJES
// =====================================================================
let TOKEN = localStorage.getItem("hq_token") || "";
let leads = [], afspraken = [], inst = structuredClone(STANDAARD), planning = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAGEN = ["zo", "ma", "di", "wo", "do", "vr", "za"];
const DAGEN_LANG = ["zondag", "maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag"];

function dagSleutel(d) { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; }
function begin(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function plusDagen(d, n) { const x = begin(d); x.setDate(x.getDate() + n); return x; }
function isWerkdag(d) { return (inst.uren[new Date(d).getDay()] || 0) > 0; }
function plusWerkdagen(d, n) { let x = begin(d); let teller = 0; while (teller < n) { x = plusDagen(x, 1); if (isWerkdag(x)) teller++; } return x; }
function volgendeWerkdag(d) { let x = begin(d); while (!isWerkdag(x)) x = plusDagen(x, 1); return x; }
function mooiDatum(d) { const x = new Date(d); return `${DAGEN[x.getDay()]} ${x.getDate()}-${x.getMonth() + 1}`; }
function uren(min) { const u = Math.floor(min / 60), m = Math.round(min % 60); return u ? `${u}u${m ? " " + m + "m" : ""}` : `${m}m`; }
function euro(n) { return "€" + Math.round(n).toLocaleString("nl-NL"); }

async function api(pad, body) {
  const r = await fetch(WORKER_URL + "/api/" + pad, {
    method: body ? "POST" : "GET",
    headers: { "Authorization": "Bearer " + TOKEN, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { uitloggen("Je token klopt niet (meer). Log opnieuw in."); throw new Error("Geen toegang"); }
  if (!r.ok) throw new Error(d.fout || "Er ging iets mis.");
  return d;
}

// =====================================================================
// TIJD PER AANVRAAG EN OFFERTE
// =====================================================================
function geschatteMinuten(l) {
  if (l.uren_handmatig) return Math.round(parseFloat(l.uren_handmatig) * 60);
  const punten = (l.rapport && l.rapport.punten) || [];
  const som = punten.reduce((s, p) => s + (inst.minuten[p.naam] ?? 30), 0);
  return Math.max(60, som + inst.vaste_minuten.oplevering_extra);
}

function offerte(l) {
  const punten = (l.rapport && l.rapport.punten) || [];
  const onderdelen = [...new Set(punten.map(p => PRIJS_VAN[p.naam]).filter(Boolean))];
  const regels = onderdelen.map(k => ({ naam: PRIJS_NAAM[k] || k, prijs: inst.prijzen[k] || 0 }));
  const totaal = regels.reduce((s, r) => s + r.prijs, 0);
  const korting = regels.length >= 3 ? Math.round(totaal * inst.korting / 100) : 0;
  return { regels, totaal, korting, prijs: totaal - korting };
}

// =====================================================================
// PLANNING: welke taken, en wanneer
// Regel: wat het eerst af moet, gaat voor. Moeten meerdere dingen op dezelfde dag af,
// dan eerst de grootste klus en de kleintjes daarna. Elke dag blijft een buffer vrij.
// =====================================================================
function taken() {
  const nu = begin(new Date());
  const lijst = [];
  for (const l of leads) {
    const klant = l.rapport?.naam || l.bedrijf || l.naam;
    const basis = { lead: l.id, klant };
    const aangevraagd = begin(l.tijd);
    if (l.status === "nieuw") {
      lijst.push({ ...basis, soort: "rapport", titel: "Rapport + offerte sturen", minuten: inst.vaste_minuten.rapport,
                   start: aangevraagd, deadline: plusWerkdagen(aangevraagd, inst.termijn_rapport) });
    } else if (l.status === "rapport_verstuurd" || l.status === "offerte_verstuurd") {
      const sinds = begin(l.rapport_verstuurd_op || l.bijgewerkt || l.tijd);
      const start = plusWerkdagen(sinds, inst.opvolgen_na);
      lijst.push({ ...basis, soort: "opvolgen", titel: "Opvolgen: bellen of mailen", minuten: inst.vaste_minuten.opvolgen,
                   start, deadline: plusWerkdagen(start, 1) });
    } else if (l.status === "akkoord" || l.status === "in_uitvoering") {
      const akkoord = begin(l.akkoord_op || l.bijgewerkt || l.tijd);
      lijst.push({ ...basis, soort: "uitvoeren", titel: "Verbeteringen uitvoeren + opleveren", minuten: geschatteMinuten(l),
                   start: akkoord, deadline: plusWerkdagen(akkoord, inst.termijn_uitvoering) });
    } else if (l.status === "opgeleverd") {
      const start = plusDagen(begin(l.opgeleverd_op || l.bijgewerkt || l.tijd), inst.herscan_na);
      lijst.push({ ...basis, soort: "herscan", titel: "Herscan + resultaat sturen", minuten: inst.vaste_minuten.herscan,
                   start, deadline: plusWerkdagen(start, 2) });
    }
  }
  // Wat al te laat had moeten starten, kan pas vandaag beginnen.
  for (const t of lijst) if (t.start < nu) t.start = nu;
  return lijst;
}

function afsprakenOp(dag) {
  const k = dagSleutel(dag);
  return afspraken.filter(a => a.datum === k).sort((a, b) => a.tijd.localeCompare(b.tijd));
}

function capaciteit(dag) {
  const bruto = (inst.uren[new Date(dag).getDay()] || 0) * 60;
  const afspraakMin = afsprakenOp(dag).reduce((s, a) => s + (parseInt(a.duur) || 0), 0);
  return Math.max(0, Math.round(bruto * (1 - inst.buffer / 100)) - afspraakMin);
}

function maakPlanning(extra = []) {
  const alle = [...taken(), ...extra].map(t => ({ ...t, rest: t.minuten, blokken: [] }));
  // Volgorde: eerst de deadline, bij dezelfde deadline de grootste klus eerst.
  alle.sort((a, b) => (a.deadline - b.deadline) || (b.minuten - a.minuten));
  const dagen = [];
  let dag = begin(new Date());
  for (let i = 0; i < 60 && alle.some(t => t.rest > 0); i++, dag = plusDagen(dag, 1)) {
    if (!isWerkdag(dag)) continue;
    let over = capaciteit(dag);
    const vandaag = { dag: new Date(dag), cap: over, blokken: [] };
    for (const t of alle) {
      if (t.rest <= 0 || t.start > dag || over < 15) continue;
      const stuk = Math.min(t.rest, over);
      t.rest -= stuk; over -= stuk;
      const blok = { taak: t, minuten: stuk };
      t.blokken.push({ dag: new Date(dag), minuten: stuk });
      vandaag.blokken.push(blok);
      if (t.rest <= 0) t.eind = new Date(dag);
    }
    vandaag.gebruikt = vandaag.cap - over;
    dagen.push(vandaag);
  }
  for (const t of alle) {
    if (!t.eind) { t.status = "telaat"; continue; }
    const speling = Math.round((t.deadline - t.eind) / 86400000);
    t.status = t.eind > t.deadline ? "telaat" : speling < 1 ? "krap" : "ok";
  }
  return { taken: alle, dagen };
}

/** De secretaresse: wanneer kun je een nieuwe klus van X uur opleveren als je vandaag ja zegt? */
function eerstMogelijkeOplevering(minuten) {
  const proef = { lead: "proef", klant: "nieuw", soort: "proef", titel: "proef", minuten, start: begin(new Date()),
                  deadline: plusWerkdagen(new Date(), 999) };
  const p = maakPlanning([proef]);
  const t = p.taken.find(x => x.lead === "proef");
  return t && t.eind ? t.eind : null;
}

// =====================================================================
// MAILS (de secretaresse schrijft ze voor je)
// =====================================================================
function mails(l) {
  const r = l.rapport || {};
  const voornaam = (l.naam || "").split(" ")[0] || "daar";
  const bedrijf = r.naam || l.bedrijf || "je bedrijf";
  const site = r.website || l.website || "";
  const o = offerte(l);
  const punten = (r.punten || []).map(p => `- ${p.tip || p.naam}`).join("\n");
  const offerteRegels = o.regels.map(x => `- ${x.naam}: ${euro(x.prijs)}`).join("\n") +
    (o.korting ? `\n- Pakketkorting (${inst.korting}%): -${euro(o.korting)}` : "") + `\n\nTotaal: ${euro(o.prijs)} excl. btw, eenmalig.`;
  const lever = eerstMogelijkeOplevering(geschatteMinuten(l));
  const ondertekening = "\n\nGroet,\nNoah Bruinsma";
  return {
    rapport: {
      onderwerp: `Je AI-Spiegel rapport voor ${bedrijf}`,

function statusLabel(s) { const [t, k] = STATUS[s] || [s, "var(--grijs)"]; return `<span class="label" style="background:${k}22;color:${k}">${t}</span>`; }

function toonVandaag() {
  const nu = new Date();
  const vandaag = planning.dagen.find(d => dagSleutel(d.dag) === dagSleutel(nu));
  const uur = nu.getHours();
  const groet = uur < 12 ? "Goedemorgen" : uur < 18 ? "Goedemiddag" : "Goedenavond";
  const nieuw = leads.filter(l => l.status === "nieuw");
  const teLaat = planning.taken.filter(t => t.status === "telaat");
  const krap = planning.taken.filter(t => t.status === "krap");
  const afsprVandaag = afsprakenOp(nu);
  const minutenVandaag = vandaag ? vandaag.gebruikt : 0;
  const lever4 = eerstMogelijkeOplevering(240);

  const punten = [];
  if (!isWerkdag(nu)) punten.push("Vandaag is geen werkdag in je planning. Geniet ervan!");
  else punten.push(`Vandaag staan er <strong>${vandaag ? vandaag.blokken.length : 0} taken</strong> gepland (${uren(minutenVandaag)})${afsprVandaag.length ? ` en ${afsprVandaag.length} ${afsprVandaag.length === 1 ? "afspraak" : "afspraken"}` : ""}.`);
  if (nieuw.length) punten.push(`Er ${nieuw.length === 1 ? "staat <strong>1 nieuwe aanvraag</strong>" : `staan <strong>${nieuw.length} nieuwe aanvragen</strong>`} klaar. Die krijgen binnen ${inst.termijn_rapport} werkdagen een rapport.`);
  if (teLaat.length) punten.push(`<span style="color:var(--rood)">⚠️ ${teLaat.length} ${teLaat.length === 1 ? "taak haalt" : "taken halen"} de afgesproken datum niet.</span> Kijk bij Planning; maak extra tijd vrij of spreek een nieuwe datum af.`);
  else if (krap.length) punten.push(`<span style="color:var(--oranje)">${krap.length} ${krap.length === 1 ? "taak zit" : "taken zitten"} krap op de deadline.</span> Liever vandaag dan morgen.`);
  else punten.push("Alles ligt op schema, met buffer voor uitloop. 👍");
  if (lever4) punten.push(`Komt er nu een nieuwe klant bij (klus van ±4 uur)? Dan kun je opleveren op <strong>${DAGEN_LANG[lever4.getDay()]} ${lever4.getDate()}-${lever4.getMonth() + 1}</strong>. Beloof niet eerder.`);

  const blokken = vandaag ? vandaag.blokken : [];
  const takenHtml = [
    ...afsprVandaag.map(a => `<div class="taak"><div class="tijd">${esc(a.tijd)}</div><div class="wat"><strong>🤝 ${esc(a.titel)}</strong><div class="klein">${esc(a.duur)} min${a.met ? " · " + esc(a.met) : ""}</div></div></div>`),
    ...blokken.map(b => `<div class="taak"><div class="tijd">${uren(b.minuten)}</div><div class="wat"><strong>${esc(b.taak.titel)}</strong> — ${esc(b.taak.klant)}
        <div class="klein">Deadline ${mooiDatum(b.taak.deadline)}${b.minuten < b.taak.minuten ? ` · deel van ${uren(b.taak.minuten)}` : ""}
        ${b.taak.status === "telaat" ? ' · <span style="color:var(--rood)">haalt deadline niet</span>' : b.taak.status === "krap" ? ' · <span style="color:var(--oranje)">krap</span>' : ""}</div></div>
        ${b.taak.lead !== "proef" ? `<button class="licht klein" onclick="openLead('${b.taak.lead}')">Open</button>` : ""}</div>`),
  ].join("") || `<p class="klein">Niets gepland voor vandaag.</p>`;

  const open = leads.filter(l => !["herscan_gedaan", "afgewezen"].includes(l.status));
  const pijplijn = open.reduce((s, l) => s + (["rapport_verstuurd", "offerte_verstuurd"].includes(l.status) ? offerte(l).prijs : 0), 0);
  const bevestigd = open.reduce((s, l) => s + (["akkoord", "in_uitvoering"].includes(l.status) ? (parseFloat(l.offerte_bedrag) || offerte(l).prijs) : 0), 0);

  $("tab-vandaag").innerHTML = `
    <h1>${groet}, Noah</h1>
    <p class="sub">${DAGEN_LANG[nu.getDay()]} ${nu.getDate()}-${nu.getMonth() + 1}-${nu.getFullYear()}</p>
    <div class="kaart secretaresse">
      <div class="groet">📋 Je secretaresse</div>
      <ul>${punten.map(p => `<li>${p}</li>`).join("")}</ul>
    </div>
    <div class="raster">
      <div class="kaart tegel"><div class="getal">${nieuw.length}</div><div class="lbl">Nieuwe aanvragen</div></div>
      <div class="kaart tegel"><div class="getal">${open.length}</div><div class="lbl">Lopende klanten</div></div>
      <div class="kaart tegel"><div class="getal">${euro(pijplijn)}</div><div class="lbl">Offertes uitstaand</div></div>
      <div class="kaart tegel"><div class="getal">${euro(bevestigd)}</div><div class="lbl">Bevestigd, nog op te leveren</div></div>
    </div>
    <h2>Vandaag doen</h2>
    <div class="kaart">${takenHtml}</div>`;
}

function toonPlanning() {
  const weken = [];
  let maandag = begin(new Date()); maandag = plusDagen(maandag, -((maandag.getDay() + 6) % 7));
  for (let w = 0; w < 2; w++) {
    const dagen = [];
    for (let i = 0; i < 5; i++) {
      const dag = plusDagen(maandag, w * 7 + i);
      const p = planning.dagen.find(d => dagSleutel(d.dag) === dagSleutel(dag));
      const afs = afsprakenOp(dag);
      const cap = capaciteit(dag), gebruikt = p ? p.gebruikt : 0;
      const isVandaag = dagSleutel(dag) === dagSleutel(new Date());
      const verleden = dag < begin(new Date());
      dagen.push(`<div class="dag ${isVandaag ? "vandaag" : ""}" style="${verleden ? "opacity:.5" : ""}">
        <h4>${DAGEN[dag.getDay()]} ${dag.getDate()}-${dag.getMonth() + 1}</h4>
        <div class="klein">${isWerkdag(dag) ? `${uren(gebruikt)} van ${uren(cap)} gepland` : "Vrij"}</div>
        <div class="vol"><div style="width:${cap ? Math.min(100, 100 * gebruikt / cap) : 0}%"></div></div>
        ${afs.map(a => `<div class="blok afspraak"><strong>${esc(a.tijd)} ${esc(a.titel)}</strong>${esc(a.duur)} min</div>`).join("")}
        ${(p ? p.blokken : []).map(b => `<div class="blok ${b.taak.status === "telaat" ? "telaat" : b.taak.status === "krap" ? "krap" : "taakblok"}" onclick="openLead('${b.taak.lead}')">
            <strong>${esc(b.taak.klant)}</strong>${esc(b.taak.titel)} · ${uren(b.minuten)}</div>`).join("")}
      </div>`);
    }
    weken.push(`<h2>${w === 0 ? "Deze week" : "Volgende week"}</h2><div class="agenda">${dagen.join("")}</div>`);
  }
  const probleem = planning.taken.filter(t => t.status !== "ok");
  $("tab-planning").innerHTML = `
    <h1>Planning</h1>
    <p class="sub">Wat het eerst af moet, gaat voor. Moeten meerdere klussen op dezelfde dag af, dan de grootste eerst. Elke dag blijft ${inst.buffer}% vrij voor uitloop.</p>
    ${probleem.length ? probleem.map(t => `<div class="melding ${t.status === "telaat" ? "rood" : "oranje"}">
        <strong>${esc(t.klant)}</strong>: ${esc(t.titel)} (${uren(t.minuten)}) — deadline ${mooiDatum(t.deadline)},
        ${t.eind ? `klaar op ${mooiDatum(t.eind)}` : "past niet in de komende weken"}. ${t.status === "telaat" ? "Maak extra tijd vrij, of spreek een nieuwe datum af." : "Krap: begin op tijd."}</div>`).join("")
      : `<div class="melding groen">Alles past binnen de afgesproken termijnen, met buffer. 👍</div>`}
    ${weken.join("")}
    <div class="melding blauw" style="margin-top:16px">Tijd per klus wordt geschat uit de verbeterpunten in het rapport. Duurt een klus langer of korter? Pas bij de aanvraag de uren aan, dan schuift de planning vanzelf mee.</div>`;
}

function toonAanvragen() {
  const rijen = leads.map(l => {

    const taak = planning.taken.find(t => t.lead === l.id);
    return `<tr>
      <td><a href="#" onclick="openLead('${l.id}');return false"><strong>${esc(r.naam || l.bedrijf || l.naam)}</strong></a>
        <div class="klein">${esc(l.naam)}${l.email ? " · " + esc(l.email) : ""}</div>

      <td>${r.score ?? l.score ?? "–"}</td>
      <td><select onchange="zetStatus('${l.id}', this.value)">${Object.entries(STATUS).map(([k, [t]]) => `<option value="${k}" ${k === (l.status || "nieuw") ? "selected" : ""}>${t}</option>`).join("")}</select></td>
      <td>${uren(geschatteMinuten(l))}${l.uren_handmatig ? ' <span class="klein">(eigen)</span>' : ""}</td>
      <td>${o.regels.length ? euro(o.prijs) : "–"}</td>
      <td>${taak ? `${esc(taak.titel)}<div class="klein">vóór ${mooiDatum(taak.deadline)}${taak.status === "telaat" ? ' · <span style="color:var(--rood)">te laat</span>' : taak.status === "krap" ? ' · <span style="color:var(--oranje)">krap</span>' : ""}</div>` : '<span class="klein">–</span>'}</td>

  $("tab-aanvragen").innerHTML = `

        <button type="submit">Toevoegen + scannen</button>
      </form>

    <div class="kaart" style="overflow-x:auto">
      <table><tr><th>Klant</th><th>Score</th><th>Status</th><th>Werk</th><th>Offerte</th><th>Volgende stap</th></tr>
      ${rijen || '<tr><td colspan="6" class="klein">Nog geen aanvragen.</td></tr>'}</table>
    </div>`;
  $("nieuweLead").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target), knop = e.target.querySelector("button");

    for (const k of ["buffer", "termijn_rapport", "opvolgen_na", "termijn_uitvoering", "herscan_na", "korting"]) inst[k] = parseFloat(f.get(k)) || 0;
    for (const k of Object.keys(inst.prijzen)) inst.prijzen[k] = parseFloat(f.get("prijs_" + k)) || 0;
    e.target.querySelectorAll("[data-min]").forEach(x => inst.minuten[x.dataset.min] = parseFloat(x.value) || 0);
    try { await api("instellingen", { instellingen: inst }); alles(); alert("Opgeslagen."); } catch (err) { alert(err.message); }
  });
  $("standaard").addEventListener("click", async () => {
    if (!confirm("Alle instellingen terugzetten naar standaard?")) return;
    inst = structuredClone(STANDAARD);
    try { await api("instellingen", { instellingen: inst }); } catch { /* lokaal toch tonen */ }
    alles();
  });
}

// =====================================================================
// PANEEL: één aanvraag met rapport, mails, notities
// =====================================================================
window.openLead = function (id) {
  const l = leads.find(x => x.id === id);
  if (!l) return;
  const r = l.rapport || {};
  const o = offerte(l);
  const m = mails(l);
  const taak = planning.taken.find(t => t.lead === id);
  $("paneel").classList.remove("verborgen");
  $("paneel").innerHTML = `
    <button class="licht klein sluit" onclick="document.getElementById('paneel').classList.add('verborgen')">Sluiten ✕</button>
    <h1>${esc(r.naam || l.bedrijf || l.naam)}</h1>
    <p class="klein">${esc(l.naam)}${l.email ? ` · <a href="mailto:${esc(l.email)}">${esc(l.email)}</a>` : ""}${(r.website || l.website) ? ` · <a href="${esc(r.website || l.website)}" target="_blank">${esc(r.website || l.website)}</a>` : ""}</p>
    <div class="rij" style="margin:12px 0">${statusLabel(l.status || "nieuw")}
      <span class="klein">Score ${r.score ?? l.score ?? "–"} · ${esc(r.branche || "?")}${r.plaats ? " in " + esc(r.plaats) : ""}${r.markt ? " · " + esc(r.markt) : ""}</span></div>
    ${taak ? `<div class="melding ${taak.status === "telaat" ? "rood" : taak.status === "krap" ? "oranje" : "groen"}">Volgende stap: <strong>${esc(taak.titel)}</strong> (${uren(taak.minuten)}), vóór ${mooiDatum(taak.deadline)}${taak.eind ? `, gepland klaar ${mooiDatum(taak.eind)}` : ""}.</div>` : ""}
    ${l.ai ? `<div class="melding blauw">AI-check: ${esc(l.ai)}</div>` : ""}

    <h2>Verbeterpunten (${(r.punten || []).length})</h2>
    ${(r.punten || []).map(p => `<div style="margin-bottom:6px"><strong>${esc(p.naam)}</strong> <span class="klein">${p.punten}/${p.maximum} · ±${inst.minuten[p.naam] ?? 30} min</span></div>`).join("") || '<p class="klein">Geen rapport bewaard.</p>'}
    ${l.id && TOKEN ? `<p style="margin-top:8px"><a href="${WORKER_URL}/rapport?id=${encodeURIComponent(l.id)}&token=${encodeURIComponent(TOKEN)}" target="_blank">Volledig rapport met bewijs →</a></p>` : ""}

    <h2>Offerte</h2>
    ${o.regels.length ? `<table>${o.regels.map(x => `<tr><td>${esc(x.naam)}</td><td>${euro(x.prijs)}</td></tr>`).join("")}
      ${o.korting ? `<tr><td>Pakketkorting ${inst.korting}%</td><td>-${euro(o.korting)}</td></tr>` : ""}
      <tr><td><strong>Totaal excl. btw</strong></td><td><strong>${euro(o.prijs)}</strong></td></tr></table>` : '<p class="klein">Geen verbeterpunten om te offreren.</p>'}

    <h2>Mails van je secretaresse</h2>
    <div class="tabjes">${Object.keys(m).map(k => `<button class="licht klein" data-mail="${k}">${{ rapport: "Rapport + offerte", opvolgen: "Opvolgen", oplevering: "Oplevering", herscan: "Herscan" }[k]}</button>`).join("")}</div>
    <div id="mailvak"></div>

    <h2>Gegevens</h2>
    <form id="leadform" class="raster" style="grid-template-columns:1fr 1fr">
      <label>Status<select name="status">${Object.entries(STATUS).map(([k, [t]]) => `<option value="${k}" ${k === (l.status || "nieuw") ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      <label>Uren werk (leeg = schatting ${uren(geschatteMinuten({ ...l, uren_handmatig: "" }))})<input name="uren_handmatig" type="number" step="0.25" min="0" value="${esc(l.uren_handmatig || "")}"></label>
      <label>Afgesproken prijs (€)<input name="offerte_bedrag" type="number" min="0" value="${esc(l.offerte_bedrag || "")}" placeholder="${o.prijs || ""}"></label>
      <label>Telefoon<input name="telefoon" value="${esc(l.telefoon || "")}"></label>
      <label style="grid-column:1/-1">Notities<textarea name="notities">${esc(l.notities || "")}</textarea></label>
      <div class="rij" style="grid-column:1/-1"><button type="submit">Opslaan</button>
        <button type="button" class="licht" id="verwijderLead">Verwijderen</button></div>
    </form>`;
  const toonMail = (k) => {
    const x = m[k];
    $("mailvak").innerHTML = `<p class="klein">Onderwerp: <strong>${esc(x.onderwerp)}</strong></p><pre>${esc(x.tekst)}</pre>
      <div class="rij" style="margin-top:8px">
        <button class="klein" id="kopieerMail">Kopieer tekst</button>
        ${l.email ? `<a class="knop licht klein" href="mailto:${esc(l.email)}?subject=${encodeURIComponent(x.onderwerp)}&body=${encodeURIComponent(x.tekst)}">Open in Mail</a>` : ""}
      </div>`;
    $("kopieerMail").onclick = () => navigator.clipboard.writeText(x.tekst).then(() => $("kopieerMail").textContent = "Gekopieerd ✓");
  };
  document.querySelectorAll("[data-mail]").forEach(b => b.onclick = () => toonMail(b.dataset.mail));
  toonMail(l.status === "opgeleverd" ? "herscan" : ["rapport_verstuurd", "offerte_verstuurd"].includes(l.status) ? "opvolgen" : ["akkoord", "in_uitvoering"].includes(l.status) ? "oplevering" : "rapport");
  $("leadform").addEventListener("submit", async (e) => {
    e.preventDefault();
    const wijzig = Object.fromEntries(new FormData(e.target));
    stempelDatum(l, wijzig.status, wijzig);
    try { await api("lead", { id, wijzig }); await laden(); openLead(id); } catch (err) { alert(err.message); }
  });
  $("verwijderLead").onclick = async () => {
    if (!confirm("Deze aanvraag definitief verwijderen?")) return;
    try { await api("lead", { id, verwijderen: true }); $("paneel").classList.add("verborgen"); await laden(); } catch (err) { alert(err.message); }
  };
};

/** Bij een nieuwe status meteen de datum vastleggen, zodat de planning weet vanaf wanneer. */
function stempelDatum(l, status, wijzig) {
  const vandaag = new Date().toISOString();
  if (status === "rapport_verstuurd" || status === "offerte_verstuurd") { if (!l.rapport_verstuurd_op) wijzig.rapport_verstuurd_op = vandaag; }
  if (status === "akkoord" && !l.akkoord_op) wijzig.akkoord_op = vandaag;
  if (status === "opgeleverd" && !l.opgeleverd_op) wijzig.opgeleverd_op = vandaag;
}

window.zetStatus = async function (id, status) {
  const l = leads.find(x => x.id === id);
  const wijzig = { status };
  stempelDatum(l, status, wijzig);
  try { await api("lead", { id, wijzig }); await laden(); } catch (err) { alert(err.message); }
};

window.verwijderAfspraak = async function (id) {
  afspraken = afspraken.filter(a => a.id !== id);
  try { await api("afspraken", { afspraken }); } catch (err) { alert(err.message); }
  alles();
};

/** Afspraak als .ics-bestand: opent in Apple Agenda / Google Agenda. */
window.ics = function (id) {
  const a = afspraken.find(x => x.id === id);
  const [j, m, d] = a.datum.split("-"), [u, mi] = a.tijd.split(":");
  const start = new Date(j, m - 1, d, u, mi), eind = new Date(start.getTime() + (parseInt(a.duur) || 30) * 60000);
  const f = (x) => x.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const inhoud = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Noah HQ//NL", "BEGIN:VEVENT", `UID:${a.id}@noah-hq`,
    `DTSTAMP:${f(new Date())}`, `DTSTART:${f(start)}`, `DTEND:${f(eind)}`, `SUMMARY:${a.titel}${a.met ? " – " + a.met : ""}`,
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([inhoud], { type: "text/calendar" }));
  link.download = `afspraak-${a.datum}.ics`; link.click();
};

// =====================================================================
// OPSTARTEN
// =====================================================================
function alles() {
  planning = maakPlanning();
  const nieuw = leads.filter(l => l.status === "nieuw").length;
  $("teller-nieuw").textContent = nieuw || "";
  toonVandaag(); toonPlanning(); toonAanvragen(); toonAfspraken(); toonSites(); toonInstellingen();
  $("laatst").textContent = "Bijgewerkt " + new Date().toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
}

async function laden() {
  const [a, b, c] = await Promise.all([api("leads"), api("afspraken"), api("instellingen")]);
  leads = a.leads || [];
  afspraken = b.afspraken || [];
  // Opgeslagen instellingen over de standaard heen leggen (zo komen nieuwe velden er vanzelf bij).
  const s = c.instellingen || {};
  inst = { ...structuredClone(STANDAARD), ...s,
           uren: { ...STANDAARD.uren, ...(s.uren || {}) }, prijzen: { ...STANDAARD.prijzen, ...(s.prijzen || {}) },
           minuten: { ...STANDAARD.minuten, ...(s.minuten || {}) }, vaste_minuten: { ...STANDAARD.vaste_minuten, ...(s.vaste_minuten || {}) } };
  alles();
}

function uitloggen(melding) {
  localStorage.removeItem("hq_token"); TOKEN = "";
  $("app").classList.add("verborgen"); $("inlogscherm").classList.remove("verborgen");
  if (melding) { $("inlogfout").textContent = melding; $("inlogfout").classList.remove("verborgen"); }
}

async function start() {
  if (!TOKEN) { uitloggen(); return; }
  $("inlogscherm").classList.add("verborgen"); $("app").classList.remove("verborgen");
  try { await laden(); } catch (e) { if (TOKEN) $("tab-vandaag").innerHTML = `<div class="melding rood">${esc(e.message)}</div>`; }
}

$("inlogform").addEventListener("submit", (e) => {
  e.preventDefault();
  TOKEN = $("tokenveld").value.trim();
  localStorage.setItem("hq_token", TOKEN);
  $("inlogfout").classList.add("verborgen");
  start();
});
$("uitloggen").onclick = () => uitloggen();
$("verversen").onclick = () => laden().catch(e => alert(e.message));
document.querySelectorAll("nav [data-tab]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav [data-tab]").forEach(x => x.classList.toggle("actief", x === b));
  document.querySelectorAll("main > section").forEach(s => s.classList.toggle("verborgen", s.id !== "tab-" + b.dataset.tab));
}));
start();
</script>
